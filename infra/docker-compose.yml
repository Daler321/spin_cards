# Shared service definitions. Use together with docker-compose.dev.yml or docker-compose.prod.yml
# (see Makefile). Build context is the repository root.
name: spincards

x-db-env: &db-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-spincards}:${POSTGRES_PASSWORD:-spincards}@postgres:5432/${POSTGRES_DB:-spincards}
  REDIS_URL: redis://redis:6379

x-healthcheck: &healthcheck
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 30s

services:
  postgres:
    image: postgres:16.15-alpine
    # Room for an api cluster plus the load test's own processes (make load-spin --processes).
    command: ['postgres', '-c', 'max_connections=300']
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spincards}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spincards}
      POSTGRES_DB: ${POSTGRES_DB:-spincards}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      <<: *healthcheck
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      start_period: 10s

  redis:
    image: redis:7.4.11-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      <<: *healthcheck
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      start_period: 10s

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    env_file: ../apps/api/.env
    environment:
      <<: *db-env
      RUN_MIGRATIONS: 'true'
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health']

  worker:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    env_file: ../apps/api/.env
    environment:
      <<: *db-env
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3001/health']

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile

  admin:
    build:
      context: ..
      dockerfile: apps/admin/Dockerfile

  bot:
    build:
      context: ..
      dockerfile: apps/bot/Dockerfile
    env_file: ../apps/bot/.env
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
    healthcheck:
      <<: *healthcheck
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3002/health']

  proxy:
    image: caddy:2.11.7-alpine
    ports:
      - '${PROXY_PORT:-8080}:80'
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
      admin:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:80/healthz']
      start_period: 5s

  # Default HTTPS tunnel. A free ngrok account includes one static domain (NGROK_DOMAIN),
  # so the Mini App URL in @BotFather does not change between restarts.
  ngrok:
    image: ngrok/ngrok:3.39.11-alpine
    profiles: [ngrok]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
      NGROK_DOMAIN: ${NGROK_DOMAIN:-}
    entrypoint: ['/bin/sh', '-c']
    command:
      - exec ngrok http http://proxy:80 $${NGROK_DOMAIN:+--url=$$NGROK_DOMAIN} --log stdout --log-format logfmt
    depends_on:
      proxy:
        condition: service_healthy

  # Fallback tunnel without an account (random URL on every start).
  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    profiles: [cloudflared]
    command: ['tunnel', '--no-autoupdate', '--url', 'http://proxy:80']
    depends_on:
      proxy:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  caddy_data:
